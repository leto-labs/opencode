[package]
name = "tauri-plugin-foreground-service"
version = "0.1.0"
description = "Android foreground service for keeping voice sessions alive in background"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-foreground-service"

[package.metadata.platforms.support]
windows = { level = "none", notes = "" }
linux = { level = "none", notes = "" }
macos = { level = "none", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }

[build-dependencies]
tauri-build = "2"
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
log = "0.4"
thiserror = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = ["wry"] }
