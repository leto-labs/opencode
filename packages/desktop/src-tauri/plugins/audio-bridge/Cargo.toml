[package]
name = "tauri-plugin-audio-bridge"
version = "0.1.0"
description = "Native audio capture and playback for OpenCode mobile"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-audio-bridge"

[package.metadata.platforms.support]
windows = { level = "none", notes = "" }
linux = { level = "none", notes = "" }
macos = { level = "none", notes = "" }
android = { level = "none", notes = "" }
ios = { level = "full", notes = "" }

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
log = "0.4"
thiserror = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["wry"] }
